<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Breach Checker | Cyber Awareness Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <h1>Cyber Awareness Hub</h1>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="password-check.html">Check Password</a></li>
      <li><a href="data-breach.html" class="active">Data Breach</a></li>
      <li><a href="social-engineering.html">Social Engineering</a></li>

      <li><a href="quiz.html">Cyber Quiz</a></li>
      <li><a href="tips.html">Tips</a></li>
    </ul>
  </nav>

  <section class="content">
    <h2>Check if Your Email Has Been Breached 🔍</h2>
    <p>Enter your email below to see if it appears in known data breaches.</p>
    <input type="email" id="email" placeholder="example@email.com" />
    <button onclick="checkBreach()">Check</button>
    <div id="result"></div>
  </section>

  <footer>
    <p>© 2025 Ahmed Hamad — All Rights Reserved.</p>
  </footer>

  <script>
    async function checkBreach() {
      const email = document.getElementById('email').value.trim();
      const resultDiv = document.getElementById('result');
      if (!email) {
        resultDiv.innerHTML = "<p>Please enter a valid email address.</p>";
        return;
      }

      resultDiv.innerHTML = "<p>Checking...</p>";

      try {
        const response = await fetch(`https://haveibeenpwned.com/unifiedsearch/${encodeURIComponent(email)}`, {
          headers: { 'User-Agent': 'CyberAwarenessHub' }
        });

        if (response.status === 404) {
          resultDiv.innerHTML = "<p class='safe'>✅ Good news — your email was not found in any known breaches!</p>";
        } else if (response.ok) {
          const data = await response.json();
          const breaches = data.Breaches.map(b => `<li>${b.Name}</li>`).join('');
          resultDiv.innerHTML = `
            <p class='alert'>⚠️ Oh no — your email appears in the following breaches:</p>
            <ul>${breaches}</ul>
            <p>👉 Change your passwords immediately and enable Two-Factor Authentication (2FA).</p>
          `;
        } else {
          resultDiv.innerHTML = "<p>⚠️ Error fetching data. Try again later.</p>";
        }
      } catch (error) {
        resultDiv.innerHTML = "<p>⚠️ Network error. Please check your connection.</p>";
      }
    }
  </script>
</body>
</html>
