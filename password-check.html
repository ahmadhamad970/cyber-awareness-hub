<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Strength Checker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <h1>Cyber Awareness Hub</h1>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="password-check.html" class="active">Check Password</a></li>
      <li><a href="data-breach.html">Data Breach</a></li>
      <li><a href="social-engineering.html">Social Engineering</a></li>
      <li><a href="phishing-awareness.html">Phishing Awareness</a></li>
      <li><a href="quiz.html">Cyber Quiz</a></li>
      <li><a href="tips.html">Tips</a></li>
    </ul>
  </nav>

  <section class="content">
    <h2>Check Your Password Strength 🔒</h2>
    <input type="password" id="password" placeholder="Enter your password..." />
    <button onclick="checkPassword()">Check</button>
    <p id="result"></p>
  </section>

  <footer>
    <p>© 2025 Ahmed Hamad — All Rights Reserved.</p>
  </footer>

  <script>
    function checkPassword() {
      const password = document.getElementById("password").value;
      const result = document.getElementById("result");
      let strength = "Weak";

      if (password.length > 8 && /[A-Z]/.test(password) &&
          /[0-9]/.test(password) && /[^A-Za-z0-9]/.test(password)) {
        strength = "Strong";
      } else if (password.length >= 6) {
        strength = "Medium";
      }

      result.textContent = `Password strength: ${strength}`;
      result.style.color = strength === "Strong" ? "#3fb950" :
                           strength === "Medium" ? "#d29922" : "#f85149";
    }
  </script>
</body>
</html>
