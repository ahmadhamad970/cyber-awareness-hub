<body>

  <!-- NAVBAR -->
  <nav>

    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="password-tools.html" class="active">Password Tools</a></li>
      <li><a href="encryption.html">Encryption Tool</a></li>

  <!-- TWO CARDS -->
  <div class="cards-wrapper">

    <!-- CARD 1 -->
    <div class="pw-card">
      <h2>Password Strength Checker</h2>

      <input type="password" id="pw1" placeholder="Enter your password…">

      <label class="show-label">
        <input type="checkbox" id="show1"> Show password
      </label>

      <div class="two-btns">
        <button class="btn-red" id="check1">Check Strength</button>
        <button class="btn-outline" id="suggest1">Suggest Stronger</button>
      </div>

      <div id="out1" class="result-box"></div>
      <div id="tips1" class="result-box"></div>
    </div>

    <!-- CARD 2 -->
    <div class="pw-card">
      <h2>Crack Time Estimator ⏱️</h2>

      <input type="password" id="pw2" placeholder="Enter password…">

      <label class="show-label">
        <input type="checkbox" id="show2"> Show password
      </label>

      <select id="speed2">
        <option value="1000">1,000 guesses/sec</option>
        <option value="100000">100,000 guesses/sec</option>
        <option value="1000000" selected>1,000,000 guesses/sec</option>
        <option value="1000000000">1,000,000,000 guesses/sec</option>
      </select>

      <button class="btn-red" id="calc2">Calculate</button>

      <div id="out2" class="result-box"></div>
    </div>

  </div>

  <footer>
    © 2026 Ahmad Hamad — All Rights Reserved.
  </footer>


<script>
/* ------------ SCORE PASSWORD ------------ */
function scorePassword(pw){
  let s=0;
  if(!pw) return {score:0,label:"Empty"};
  if(pw.length>=8) s+=2;
  if(pw.length>=12) s+=2;
  if(/[a-z]/.test(pw)) s+=1;
  if(/[A-Z]/.test(pw)) s+=1;
  if(/[0-9]/.test(pw)) s+=1;
  if(/[^A-Za-z0-9]/.test(pw)) s+=2;

  let pct=Math.round((s/9)*100);
  let label=pct>=80?"Strong":pct>=50?"Medium":"Weak";
  return {score:pct,label};
}

/* ------------ IMPROVE PASSWORD ------------ */
function improvePassword(pw){
  let x=pw.replace(/a/gi,"@").replace(/s/gi,"$").replace(/i/gi,"1")
          .replace(/o/gi,"0").replace(/e/gi,"3").replace(/t/gi,"7");

  if(!/[0-9]/.test(x)) x+="42";
  if(!/[^A-Za-z0-9]/.test(x)) x+="!";
  while(x.length<14) x+="!@#"[Math.floor(Math.random()*3)];
  return x;
}

/* ------------ CRACK TIME ------------ */
function crackTime(pw,speed){
  let charset=0;
  if(/[a-z]/.test(pw)) charset+=26;
  if(/[A-Z]/.test(pw)) charset+=26;
  if(/[0-9]/.test(pw)) charset+=10;
  if(/[^A-Za-z0-9]/.test(pw)) charset+=33;

  let combos=1n;
  for(let i=0;i<pw.length;i++) combos*=BigInt(charset);
  let sec=Number(combos/BigInt(speed));
  return formatTime(sec);
}

function formatTime(sec){
  if(sec<1) return (sec*1000).toFixed(2)+" ms";
  if(sec<60) return sec.toFixed(2)+" sec";
  let m=sec/60, h=m/60, d=h/24, y=d/365;
  if(m<60) return m.toFixed(2)+" min";
  if(h<24) return h.toFixed(2)+" hours";
  if(d<365) return d.toFixed(2)+" days";
  if(y<100) return y.toFixed(2)+" years";
  return (y/100).toFixed(2)+" centuries";
}

/* ------------ EVENTS ------------ */
const pw1=document.getElementById("pw1");
const pw2=document.getElementById("pw2");

document.getElementById("show1").onchange=()=>pw1.type=show1.checked?"text":"password";
document.getElementById("show2").onchange=()=>pw2.type=show2.checked?"text":"password";

document.getElementById("check1").onclick=()=>{
  let pw=pw1.value;
  if(!pw) return;

  let s=scorePassword(pw);
  out1.style.display="block";
  tips1.style.display="none";

  out1.innerHTML=`
    <strong>Password:</strong> <code>${pw}</code><br>
    <strong>Strength:</strong>
    <span class="badge ${s.label.toLowerCase()}">${s.label} (${s.score}/100)</span>
  `;
};

document.getElementById("suggest1").onclick=()=>{
  let pw=pw1.value;
  if(!pw) return;

  let improved=improvePassword(pw);
  let s=scorePassword(improved);

  out1.style.display="block";
  tips1.style.display="block";

  out1.innerHTML=`
    <strong>Original:</strong> <code>${pw}</code><br>
    <strong>Suggested:</strong> <span class="highlight">${improved}</span><br>
    <strong>Strength:</strong> 
    <span class="badge ${s.label.toLowerCase()}">${s.label} (${s.score}/100)</span>
  `;

  tips1.innerHTML=`
    <strong>Why it's stronger:</strong><br>
    • Longer length<br>
    • Added numbers & symbols<br>
    • Replaced weak letters<br>
    • Harder to brute force
  `;
};

document.getElementById("calc2").onclick=()=>{
  let pw=pw2.value;
  let speed=document.getElementById("speed2").value;
  if(!pw) return;

  let t=crackTime(pw,speed);

  out2.style.display="block";
  out2.innerHTML=`
    <strong>Password:</strong> <code>${pw}</code><br>
    <strong>Speed:</strong> ${Number(speed).toLocaleString()} guesses/sec<br><br>
    <span class="time-estimate">${t}</span>
  `;
};

</script>

</body>
