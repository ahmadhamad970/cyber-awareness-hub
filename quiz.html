<body>

      <li><a href="index.html">Home</a></li>
      <li><a href="quiz.html" class="active">Cyber Quiz</a></li>

  <section class="content">
    <h2>Cyber Awareness Quiz</h2>
    <p>Which of these is the strongest password?</p>
    <button onclick="answer(0)">password123</button>
    <button onclick="answer(1)">Ahm@d#2025</button>
    <button onclick="answer(2)">123456</button>
    <p id="result"></p>
  </section>

  <footer>
    <p>© 2025 Ahmed Hamad — All Rights Reserved.</p>
  </footer>

  <script>
    function answer(choice) {
      const result = document.getElementById("result");
      if (choice === 1)
        result.textContent = "✅ Correct! Strong password.";
      else
        result.textContent = "❌ Weak password, try again.";
    }
  </script>
